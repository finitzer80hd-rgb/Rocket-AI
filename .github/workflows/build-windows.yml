name: Build RocketAI for Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[rlbot,dev]"
          python -m pip install pyinstaller

      - name: Compile and test
        run: |
          python -m compileall -q launcher.py train_ppo.py evaluate.py check_torch.py toy_env.py dataset.py rlbot_bot.py run_rlbot.py rocketsim_smoke.py
          python -m pytest -q

      - name: Build RocketAI desktop launcher
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name RocketAI --collect-all stable_baselines3 --collect-all gymnasium --collect-all torch --collect-all numpy --hidden-import train_ppo --hidden-import evaluate --hidden-import check_torch --hidden-import toy_env launcher.py

      - name: Build RLBot agent executable
        run: |
          python -m PyInstaller --noconfirm --clean --console --onefile --name RocketAIBot --collect-all rlbot --collect-all rlbot_flatbuffers --hidden-import rlbot_bot rlbot_bot.py

      - name: Assemble Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/RocketAI-Windows | Out-Null
          Copy-Item dist/RocketAI.exe dist/RocketAI-Windows/
          Copy-Item dist/RocketAIBot.exe dist/RocketAI-Windows/
          Copy-Item bot.toml,loadout.toml,rlbot.toml,RUN_RLBOT.bat,docs/ROCKETSIM_RLBOT_SETUP.md -Destination dist/RocketAI-Windows/
          if (!(Test-Path "dist/RocketAI-Windows/RocketAI.exe")) { throw "RocketAI.exe missing" }
          if (!(Test-Path "dist/RocketAI-Windows/RocketAIBot.exe")) { throw "RocketAIBot.exe missing" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RocketAI-Windows-exe
          path: dist/RocketAI-Windows/
          if-no-files-found: error
          retention-days: 30
