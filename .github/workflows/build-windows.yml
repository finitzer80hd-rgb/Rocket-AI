name: Build RocketAI for Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[rlbot,dev]"
          # PyTorch 2.5 added a Dynamo-wrapped optimizer path that imports torch._numpy;
          # that optional module crashes in this frozen build. Use the compatible
          # PyTorch 2.4.1 wheel, which avoids that 2.5-specific startup path.
          python -m pip install --upgrade --force-reinstall "numpy==1.26.4" "gymnasium==1.0.0" "stable-baselines3==2.4.1" "torch==2.4.1"
          python -m pip install "pyinstaller==6.11.1"

      - name: Compile and test
        run: |
          python -m compileall -q launcher.py train_ppo.py evaluate.py check_torch.py toy_env.py dataset.py rlbot_bot.py run_rlbot.py rocketsim_smoke.py
          python -m pytest -q

      - name: Build RocketAI desktop launcher
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name RocketAI --collect-all stable_baselines3 --collect-all gymnasium --collect-all numpy --hidden-import train_ppo --hidden-import evaluate --hidden-import check_torch --hidden-import toy_env launcher.py

      - name: Smoke-test PPO from the frozen Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Remove-Item worker_output.log,dist/ppo_smoke.zip -Force -ErrorAction SilentlyContinue
          Write-Host "Launching frozen PPO worker..."
          try {
            $exePath = (Resolve-Path "dist/RocketAI.exe").Path
            $outputPath = Join-Path (Resolve-Path "dist").Path "ppo_smoke"
            $process = Start-Process -FilePath $exePath -ArgumentList @("--worker-train", "--timesteps", "1", "--out", $outputPath) -Wait -PassThru
            $workerExitCode = $process.ExitCode
            Write-Host "Frozen PPO worker exit code: $workerExitCode"
          } catch {
            Write-Host "PowerShell caught an executable launch error: $_"
            $workerExitCode = 999
          }

          if (Test-Path worker_output.log) {
            Write-Host "===== worker_output.log ====="
            Get-Content worker_output.log
            Write-Host "===== end worker_output.log ====="
          } else {
            Write-Host "ERROR: worker_output.log was not created. The executable may have crashed before entering the Python worker."
          }

          if ($workerExitCode -ne 0) {
            throw "Packaged PPO smoke test failed with exit code $workerExitCode. See diagnostics above."
          }
          if (!(Test-Path dist/ppo_smoke.zip)) {
            throw "Packaged PPO smoke test exited successfully but did not produce dist/ppo_smoke.zip."
          }

      - name: Build RLBot agent executable
        run: |
          python -m PyInstaller --noconfirm --clean --console --onefile --name RocketAIBot --collect-all rlbot --collect-all rlbot_flatbuffers --hidden-import rlbot_bot rlbot_bot.py

      - name: Build RLBot match runner executable
        run: |
          python -m PyInstaller --noconfirm --clean --console --onefile --name RocketAIRunner --collect-all rlbot --collect-all rlbot_flatbuffers --hidden-import run_rlbot run_rlbot.py

      - name: Assemble Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/RocketAI-Windows | Out-Null
          Copy-Item dist/RocketAI.exe,dist/RocketAIBot.exe,dist/RocketAIRunner.exe -Destination dist/RocketAI-Windows/
          Copy-Item bot.toml,loadout.toml,rlbot.toml,RUN_RLBOT.bat -Destination dist/RocketAI-Windows/
          Copy-Item docs/ROCKETSIM_RLBOT_SETUP.md -Destination dist/RocketAI-Windows/ROCKETSIM_RLBOT_SETUP.md
          foreach ($file in @("RocketAI.exe","RocketAIBot.exe","RocketAIRunner.exe","bot.toml","loadout.toml","rlbot.toml","RUN_RLBOT.bat")) {
            if (!(Test-Path "dist/RocketAI-Windows/$file")) { throw "$file missing from Windows package" }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RocketAI-Windows-exe
          path: dist/RocketAI-Windows/
          if-no-files-found: error
          retention-days: 30
