[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-ai-starter"
version = "0.1.1"
description = "Modular Rocket League AI research starter"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "gymnasium>=1.0",
  "stable-baselines3>=2.4",
  "torch>=2.4",
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["launcher", "train_ppo", "evaluate", "check_torch", "toy_env", "dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
