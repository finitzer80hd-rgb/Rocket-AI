[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-ai-starter"
version = "0.2.0"
description = "Rocket League AI starter with RLBot v5 and optional RocketSim support"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "gymnasium>=1.0",
  "stable-baselines3>=2.4",
  "torch>=2.4",
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
rlbot = ["rlbot>=2.0.0.beta"]

[tool.setuptools]
py-modules = ["launcher", "train_ppo", "evaluate", "check_torch", "toy_env", "dataset", "rlbot_bot", "run_rlbot", "rocketsim_smoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
